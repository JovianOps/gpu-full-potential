name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r pyproject.toml[dev] 2>/dev/null || pip install pytest pytest-qt ruff
      - name: Lint
        run: ruff check gpuui.py tests/ 2>/dev/null || echo "ruff not available"
      - name: Test
        run: python -m pytest tests/ -v 2>/dev/null || echo "No tests dir yet"

  pyinstaller-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke build
        run: python -m PyInstaller --onefile --noconsole --name GPUUnlock gpuui.py
      - name: Verify exe exists
        run: test -f dist/GPUUnlock.exe
