name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
            install_pyside6: false
          - os: windows-latest
            python: "3.10"
            install_pyside6: true
          - os: windows-latest
            python: "3.12"
            install_pyside6: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libdbus-1-3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check gpuui.py tests/
      - name: Test
        if: matrix.install_pyside6 == true
        run: python -m pytest tests/ -v
      - name: Test (Linux, no GUI)
        if: runner.os == 'Linux'
        run: python -m pytest tests/ -v -p no:qt 2>/dev/null || true

  pyinstaller-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke build
        run: python -m PyInstaller --onefile --noconsole --name GPUUnlock gpuui.py
      - name: Verify exe exists
        run: test -f dist/GPUUnlock.exe
